aid: adagiomedical
name: Adagio Medical
description: >-
  Adagio Medical, Inc. is a Laguna Hills, California medical device company and an operating
  subsidiary of Adagio Medical Holdings, Inc. (NASDAQ: ADGM). It develops catheter-based
  cardiac ablation systems built on its proprietary Ultra-Low Temperature Cryoablation (ULTC)
  platform and an emerging Pulsed Field Cryoablation (PFCA) platform, designed to create large,
  durable, transmural lesions for the treatment of ventricular tachycardia, atrial fibrillation
  and atrial flutter. Its CE-marked vCLAS Cryoablation System holds FDA Breakthrough Device
  Designation and is under U.S. evaluation in the FULCRUM-VT pivotal IDE study. Adagio Medical
  sells regulated physical devices to hospitals and electrophysiology labs; it publishes no
  public API, developer portal, SDK or machine-readable contract. It does publish a coordinated
  product-security vulnerability disclosure policy.
